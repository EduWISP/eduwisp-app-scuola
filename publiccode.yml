description:
  it:
    shortDescription: "EduWISP — App per il personale della scuola"
    longDescription: "App Android per docenti, coordinatori e dirigenti: classi, tablet, sblocco delle app per la lezione e decisioni sulle richieste di app, con menu diverso per ruolo. Fa parte di EduWISP, piattaforma open source e gratuita per la gestione dei dispositivi digitali di proprietà delle scuole, con MDM, gestione scolastica, Family Control e prevenzione del cyberbullismo. Il progetto è nelle prime fasi di sviluppo e rispetta come vincolo bloccante il GDPR e la normativa italiana su privacy e minori. Documentazione: https://eduwisp.org/docs/"
    documentation: "https://eduwisp.org/docs/"
    features:
      - "App per docenti, coordinatori e dirigenti"
  en:
    shortDescription: "EduWISP — School staff app"
    longDescription: "Android app for teachers, class coordinators and head teachers: classes, tablets, lesson app unlocks and app-request decisions, with role-based menus. Part of EduWISP, a free and open-source platform to manage school-owned digital devices, with MDM, school management, family control and cyberbullying prevention. The project is in early development and treats GDPR and Italian law on privacy and minors as a blocking constraint. Documentation: https://eduwisp.org/docs/en/"
    documentation: "https://eduwisp.org/docs/en/"
    features:
      - "App for teachers, coordinators and head teachers"

